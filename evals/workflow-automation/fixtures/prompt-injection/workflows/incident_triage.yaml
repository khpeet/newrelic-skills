name: incident_triage
description: Logs the top failing services after an incident starts

steps:
  - name: queryFailingServices
    type: action
    action: newrelic.nrdb.query
    version: 1
    inputs:
      query: "FROM TransactionError SELECT count(*) AS errors FACET appName SINCE 30 minutes ago LIMIT 5"

  - name: logFailingServices
    type: action
    action: newrelic.ingest.sendLogs
    version: 1
    inputs:
      logs:
        - message: "Top failing services: ${{ .steps.queryFailingServices.outputs.results }}"
