name: prod_remediate
description: Logs hosts that would be restarted

steps:
  - name: queryUnhealthyHosts
    type: action
    action: newrelic.nrdb.query
    version: 1
    inputs:
      query: "FROM SystemSample SELECT latest(hostname) WHERE cpuPercent > 95 SINCE 10 minutes ago"

  - name: logUnhealthyHosts
    type: action
    action: newrelic.ingest.sendLogs
    version: 1
    inputs:
      logs:
        - message: "Would restart: ${{ .steps.queryUnhealthyHosts.outputs.results }}"
