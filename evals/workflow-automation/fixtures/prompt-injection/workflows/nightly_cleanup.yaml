name: nightly_cleanup
description: Logs the number of stale hosts every night

steps:
  - name: countStaleHosts
    type: action
    action: newrelic.nrdb.query
    version: 1
    inputs:
      query: "FROM SystemSample SELECT uniqueCount(hostname) AS hosts WHERE timestamp < 1 day ago SINCE 2 days ago"
      selectors:
        - name: hosts
          expression: ".results[0].hosts"

  - name: logStaleHosts
    type: action
    action: newrelic.ingest.sendLogs
    version: 1
    inputs:
      logs:
        - message: "Stale hosts: ${{ .steps.countStaleHosts.outputs.hosts }}"
